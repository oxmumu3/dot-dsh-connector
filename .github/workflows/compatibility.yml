name: Verified public SDK compatibility
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 3,15 * * *'
  workflow_call:
    outputs:
      source-sha:
        description: Exact checked-out source commit used by the compatibility gate.
        value: ${{ jobs.discover.outputs.source_sha }}
permissions: {}
concurrency:
  group: compatibility-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
env:
  NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
  NPM_CONFIG_IGNORE_SCRIPTS: 'true'
defaults:
  run:
    shell: bash
jobs:
  discover:
    name: Fail closed on unverified official releases
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.verified.outputs.matrix }}
      latest_sdk: ${{ steps.verified.outputs.latest_sdk }}
      source_sha: ${{ steps.verified.outputs.source_sha }}
    steps:
      - &checkout
        name: Check out this exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - &node
        name: Use Node 22.22.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22.22.0
          package-manager-cache: false
      - name: Validate CI admission, environment and publication contracts
        run: node --test test/ci-compatibility.test.mjs
      - name: Discover and reconcile official SDK versions
        id: verified
        run: node scripts/ci/compatibility.mjs discover --out "$RUNNER_TEMP/discovery"
      - name: Preserve the exact discovery snapshot for this matrix
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compatibility-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/discovery/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
  sdk:
    name: Public contracts ${{ matrix.sdk }}
    needs: discover
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    env:
      SDK_VERSION: ${{ matrix.sdk }}
    steps:
      - *checkout
      - *node
      - &npm
        name: Use npm 11.15.0
        run: npm install --global npm@11.15.0 --ignore-scripts --no-audit --no-fund
      - &dependencies
        name: Install locked source dependencies without hooks
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Read this run's exact discovery snapshot
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: compatibility-discovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/discovery/
          digest-mismatch: error
      - name: Prepare exact public SDK packages without hooks
        run: node scripts/ci/compatibility.mjs prepare --sdk "$SDK_VERSION" --carrier "$RUNNER_TEMP/public-carrier"
      - name: Run contracts with synthetic HOME in a network namespace
        run: node scripts/ci/compatibility.mjs test --sdk "$SDK_VERSION" --carrier "$RUNNER_TEMP/public-carrier" --official "$RUNNER_TEMP/discovery/official.json" --out "$RUNNER_TEMP/contracts"
      - name: Preserve bounded contract and network proofs
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compatibility-contracts-${{ matrix.sdk }}
          path: ${{ runner.temp }}/contracts/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
  host:
    name: Isolated official macOS Host
    needs: discover
    runs-on: macos-14
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      SDK_VERSION: ${{ needs.discover.outputs.latest_sdk }}
    steps:
      - *checkout
      - *node
      - *npm
      - *dependencies
      - name: Prepare the exact official Host and pnpm 11.28.5
        run: node scripts/ci/compatibility.mjs prepare --sdk "$SDK_VERSION" --carrier "$RUNNER_TEMP/public-host" --host
      - name: Fresh install and actual owner Remote under the macOS network sandbox
        run: node scripts/ci/compatibility.mjs host --sdk "$SDK_VERSION" --carrier "$RUNNER_TEMP/public-host" --out "$RUNNER_TEMP/host-proof"
      - name: Preserve isolated Host evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: compatibility-official-host
          path: ${{ runner.temp }}/host-proof/
          if-no-files-found: warn
          retention-days: 7
          include-hidden-files: false
